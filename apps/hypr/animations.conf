# Animations: snappy open, buttery movement, soft fades.
# Speed is in deciseconds (3 = 300 ms).
# Curve control points can go above 1 for a slight spring overshoot.

bezier = snap,   0.05, 0.9,  0.1, 1.08   # fast start, tiny settle on open
bezier = butter, 0.3,  0.9,  0.2, 1      # long, smooth deceleration for movement
bezier = soft,   0.25, 0.1,  0.25, 1     # gentle ease for fades

animations {
    enabled = true

    # Windows: pop open with a tiny spring, close quickly, glide when moved
    animation = windowsIn,   1, 3,   snap,   popin 85%
    animation = windowsOut,  1, 2,   soft,   popin 90%
    animation = windowsMove, 1, 3,   butter, slide

    # Borders and fades
    animation = border,      1, 4,   soft
    animation = borderangle, 0, 1,   default
    animation = fadeIn,      1, 2.5, soft
    animation = fadeOut,     1, 2,   soft
    animation = fadeSwitch,  1, 2.5, soft

    # Layers: waybar, rofi, mako
    animation = layersIn,    1, 3,   snap,   fade
    animation = layersOut,   1, 2,   soft,   fade

    # Workspaces: buttery slide in the direction you move
    animation = workspaces,       1, 4.5, butter, slide
    animation = specialWorkspace, 1, 3.5, butter, slidevert
}
