# Hyprland. Colors come from theme.conf (generated). Keybinds live in keybinds.conf.
monitor = ,preferred,auto,1
monitor = eDP-1,1366x768@60,0x0,1
monitor = HDMI-A-1,1920x1080@100,1366x0,1
workspace = 2,monitor:HDMI-A-1,default:true

source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/animations.conf

exec-once = waybar
exec-once = ~/.local/bin/desktop wallpaper apply
exec-once = ~/.local/bin/desktop menu daemon
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/desktop menu daemon

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $colActive
    col.inactive_border = $colInactive
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 3
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $shadowColor
    }
}

input {
    touchpad {
        natural_scroll = true
        scroll_factor = 0.4
    }
}
