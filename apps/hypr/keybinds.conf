# Keybinds. Mod is SUPER. Each bind has a "# description" line above it.
# "##" lines are section headers. `desktop keys` reads this file, so keep the format.
$mod = SUPER

## Apps
# Terminal
bind = $mod, RETURN, exec, kitty
# App launcher
bind = $mod, SPACE, exec, rofi -show drun
# Files (GUI)
bind = $mod, E, exec, thunar
# Files (terminal)
bind = $mod SHIFT, E, exec, kitty -e lf
# Browser
bind = $mod, B, exec, flatpak run org.chromium.Chromium
# Keybind cheatsheet
bind = $mod, SLASH, exec, ~/.local/bin/desktop keys --menu
# Next wallpaper (current theme)
bind = $mod CTRL, W, exec, ~/.local/bin/desktop wallpaper next
# Previous wallpaper (current theme)
bind = $mod CTRL SHIFT, W, exec, ~/.local/bin/desktop wallpaper prev
# Theme picker
bind = $mod CTRL, SPACE, exec, ~/.local/bin/desktop theme-menu
# Connectivity menu (Wi-Fi and Bluetooth)
bind = $mod, N, exec, ~/.local/bin/desktop menu connectivity
# Lock screen
bind = $mod CTRL, L, exec, hyprlock
# Clipboard history
bind = $mod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
# Screenshot area
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
# Screenshot full screen
bind = , Print, exec, grim - | swappy -f -

## Windows
# Close window
bind = $mod, W, killactive
# Fullscreen
bind = $mod, F, fullscreen
# Toggle floating
bind = $mod, T, togglefloating
# Exit Hyprland
bind = $mod SHIFT, Q, exit

## Focus
# Focus left
bind = $mod, H, movefocus, l
# Focus down
bind = $mod, J, movefocus, d
# Focus up
bind = $mod, K, movefocus, u
# Focus right
bind = $mod, L, movefocus, r

## Move window
# Move window left
bind = $mod SHIFT, H, movewindow, l
# Move window down
bind = $mod SHIFT, J, movewindow, d
# Move window up
bind = $mod SHIFT, K, movewindow, u
# Move window right
bind = $mod SHIFT, L, movewindow, r

## Resize
# Wider
binde = $mod ALT, right, resizeactive, 40 0
# Narrower
binde = $mod ALT, left, resizeactive, -40 0
# Taller
binde = $mod ALT, down, resizeactive, 0 40
# Shorter
binde = $mod ALT, up, resizeactive, 0 -40

## Mouse
# Drag to move window
bindm = $mod, mouse:272, movewindow
# Drag to resize window
bindm = $mod, mouse:273, resizewindow

## Workspaces
# Switch to workspace 1
bind = $mod, 1, workspace, 1
# Switch to workspace 2
bind = $mod, 2, workspace, 2
# Switch to workspace 3
bind = $mod, 3, workspace, 3
# Switch to workspace 4
bind = $mod, 4, workspace, 4
# Switch to workspace 5
bind = $mod, 5, workspace, 5
# Switch to workspace 6
bind = $mod, 6, workspace, 6
# Switch to workspace 7
bind = $mod, 7, workspace, 7
# Switch to workspace 8
bind = $mod, 8, workspace, 8
# Switch to workspace 9
bind = $mod, 9, workspace, 9
# Switch to workspace 0
bind = $mod, 0, workspace, 10
# Move window to workspace 1
bind = $mod SHIFT, 1, movetoworkspace, 1
# Move window to workspace 2
bind = $mod SHIFT, 2, movetoworkspace, 2
# Move window to workspace 3
bind = $mod SHIFT, 3, movetoworkspace, 3
# Move window to workspace 4
bind = $mod SHIFT, 4, movetoworkspace, 4
# Move window to workspace 5
bind = $mod SHIFT, 5, movetoworkspace, 5
# Move window to workspace 6
bind = $mod SHIFT, 6, movetoworkspace, 6
# Move window to workspace 7
bind = $mod SHIFT, 7, movetoworkspace, 7
# Move window to workspace 8
bind = $mod SHIFT, 8, movetoworkspace, 8
# Move window to workspace 9
bind = $mod SHIFT, 9, movetoworkspace, 9
# Move window to workspace 0
bind = $mod SHIFT, 0, movetoworkspace, 10

## Hardware
# Brightness down
bindel = , F2, exec, brightnessctl set 5%-
# Brightness up
bindel = , F3, exec, brightnessctl set +5%
# Mute toggle
bindl = , F6, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Volume down
bindel = , F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Volume up (capped at 100%)
bindel = , F8, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
